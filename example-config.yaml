# Example OpenTelemetry Collector configuration for CockroachDB receiver
# Copy this file to config.yaml and update with your actual values

receivers:
  # CockroachDB custom receiver
  cockroachdb:
    # Required: PostgreSQL connection string to your CockroachDB cluster
    # For CockroachDB Serverless, get this from the cloud console
    connection_string: "postgresql://username:password@host:26257/defaultdb?sslmode=require"
    
    # Required: How often to collect metrics (supports: 30s, 1m, 5m, etc.)
    collection_interval: "1m"
    
    # Optional: Advanced configuration (defaults shown below)
    # query_timeout: 30s              # Timeout for individual database queries
    # query_limit: 20                 # Max results per query type
    # max_open_connections: 10        # Maximum database connections in pool
    # max_idle_connections: 5         # Maximum idle connections in pool
    # connection_max_lifetime: 1h     # Maximum connection lifetime
    # connection_max_idle_time: 10m   # Maximum connection idle time

processors:
  # Optional: Add resource attributes
  resource:
    attributes:
      - key: environment
        value: production
        action: insert
      - key: cluster.name
        value: my-cockroachdb-cluster
        action: insert

  # Optional: Batch metrics for better performance
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # Example: Export to OTLP HTTP endpoint (Grafana, Datadog, etc.)
  otlphttp:
    endpoint: "https://your-metrics-backend.com"
    headers:
      api-key: "your-api-key-here"
    compression: gzip

  # Example: Export to Prometheus Remote Write
  # prometheusremotewrite:
  #   endpoint: "https://your-prometheus-endpoint.com/api/v1/write"
  #   headers:
  #     Authorization: "Bearer your-token-here"

  # Example: Debug exporter (logs metrics to console)
  # logging:
  #   verbosity: detailed

service:
  # Optional: Configure telemetry for the collector itself
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: localhost:8888

  pipelines:
    metrics:
      receivers: [cockroachdb]
      processors: [resource, batch]
      exporters: [otlphttp]
      # For debugging, add logging exporter: [otlphttp, logging]
