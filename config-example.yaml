receivers:
  cockroachdb:
    connection_string: "postgresql://user:password@your-cluster.cockroachlabs.cloud:26257/defaultdb?sslmode=require"
    collection_interval: "60s"

processors:
  batch:
    timeout: 10s

exporters:
  otlphttp:
    endpoint: "https://your-backend.com/v1/metrics"
    headers:
      Authorization: "Bearer YOUR_TOKEN"
  
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [cockroachdb]
      processors: [batch]
      exporters: [debug]
