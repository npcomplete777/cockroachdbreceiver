# Troubleshooting Configuration Example
# Use ONLY for dev/staging or during incident response
# ⚠️  DO NOT USE IN PRODUCTION - Expensive queries enabled

receivers:
  cockroachdb:
    connection_string: "postgresql://admin:password@dev-cluster.cockroachlabs.cloud:26257/defaultdb?sslmode=require"
    
    # More frequent collection for troubleshooting
    collection_interval: "30s"
    
    # Extended timeouts for expensive queries
    query_timeout: "60s"
    max_open_connections: 15
    
    # ALL METRICS ENABLED - Full observability
    metrics:
      # Production-safe metrics
      statement_statistics: true
      transaction_statistics: true
      index_usage_statistics: true
      cluster_queries: true
      cluster_sessions: true
      cluster_transactions: true
      cluster_locks: true
      cluster_contended_indexes: true
      cluster_contended_keys: true
      cluster_contended_tables: true
      cluster_contention_events: true
      transaction_contention_events: true
      
      # ⚠️  Expensive metrics - enabled for troubleshooting
      ranges_no_leases: true
      gossip_liveness: true
      jobs: true
      schema_changes: true
      node_metrics: true
      kv_node_status: true

processors:
  batch:
    timeout: 10s

exporters:
  logging:
    verbosity: detailed
  
  otlphttp:
    endpoint: "https://your-metrics-backend.com"
    headers:
      Authorization: "Bearer YOUR_API_KEY"

service:
  telemetry:
    logs:
      level: debug

  pipelines:
    metrics:
      receivers: [cockroachdb]
      processors: [batch]
      exporters: [logging, otlphttp]
