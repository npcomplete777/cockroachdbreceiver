type: cockroachdb

status:
  class: receiver
  stability:
    alpha: [metrics]
  distributions: []
  codeowners:
    active: [npcomplete777]

resource_attributes:
  db.system.name:
    description: The database management system (DBMS) product as identified by the client instrumentation.
    type: string
    enabled: true
    enum: [cockroachdb]

attributes:
  fingerprint_id:
    description: Statement fingerprint ID.
    type: string
  app_name:
    description: Application name.
    type: string
  database:
    description: Database name.
    type: string
  query:
    description: SQL query text (may be truncated).
    type: string
  statement_type:
    description: Type of SQL statement (e.g., SELECT, INSERT).
    type: string
  last_error_code:
    description: Last error code for the statement.
    type: string
  table:
    description: Table name.
    type: string
  index:
    description: Index name.
    type: string
  schema:
    description: Schema name.
    type: string
  node_id:
    description: Node identifier.
    type: string
  status:
    description: Job or operation status.
    type: string
  job_type:
    description: Type of CockroachDB job.
    type: string
  lock_strength:
    description: Lock strength type.
    type: string
  granted:
    description: Whether lock was granted.
    type: string
  change_type:
    description: Type of schema change.
    type: string
  state:
    description: State of an operation.
    type: string

metrics:
  cockroachdb.statement.execution.count:
    enabled: true
    description: Number of times a statement was executed.
    unit: "{executions}"
    gauge:
      value_type: int
    attributes: [fingerprint_id, app_name, database, query, statement_type]

  cockroachdb.statement.error.count:
    enabled: true
    description: Number of errors for a statement.
    unit: "{errors}"
    gauge:
      value_type: int
    attributes: [fingerprint_id, app_name, query, last_error_code]

  cockroachdb.statement.retries.max:
    enabled: true
    description: Maximum number of retries for a statement.
    unit: "{retries}"
    gauge:
      value_type: int
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.latency.service.mean:
    enabled: true
    description: Average service latency for a statement.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.latency.parse.mean:
    enabled: true
    description: Average parsing latency for a statement.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.latency.plan.mean:
    enabled: true
    description: Average planning latency for a statement.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.latency.run.mean:
    enabled: true
    description: Average execution latency for a statement.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.rows.read.mean:
    enabled: true
    description: Average rows read per statement execution.
    unit: "{rows}"
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.rows.written.mean:
    enabled: true
    description: Average rows written per statement execution.
    unit: "{rows}"
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.statement.bytes.read.mean:
    enabled: true
    description: Average bytes read per statement execution.
    unit: By
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name, query]

  cockroachdb.transaction.execution.count:
    enabled: true
    description: Number of times a transaction was executed.
    unit: "{transactions}"
    gauge:
      value_type: int
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.latency.service.mean:
    enabled: true
    description: Average transaction service latency.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.latency.commit.mean:
    enabled: true
    description: Average commit latency.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.latency.retry.mean:
    enabled: true
    description: Average retry latency.
    unit: s
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.rows.read.mean:
    enabled: true
    description: Average rows read per transaction.
    unit: "{rows}"
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.rows.written.mean:
    enabled: true
    description: Average rows written per transaction.
    unit: "{rows}"
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.bytes.read.mean:
    enabled: true
    description: Average bytes read per transaction.
    unit: By
    gauge:
      value_type: double
    attributes: [fingerprint_id, app_name]

  cockroachdb.transaction.retries.max:
    enabled: true
    description: Maximum number of retries for a transaction.
    unit: "{retries}"
    gauge:
      value_type: int
    attributes: [fingerprint_id, app_name]

  cockroachdb.index.reads.total:
    enabled: true
    description: Total number of reads from an index.
    unit: "{reads}"
    gauge:
      value_type: int
    attributes: [table, index]

  cockroachdb.cluster.queries.active:
    enabled: true
    description: Number of currently active queries.
    unit: "{queries}"
    gauge:
      value_type: int

  cockroachdb.cluster.sessions.active:
    enabled: true
    description: Number of active sessions.
    unit: "{sessions}"
    gauge:
      value_type: int

  cockroachdb.cluster.transactions.active:
    enabled: true
    description: Number of active transactions.
    unit: "{transactions}"
    gauge:
      value_type: int

  cockroachdb.session.memory.allocated:
    enabled: true
    description: Memory allocated by a session.
    unit: By
    gauge:
      value_type: int
    attributes: [node_id, app_name]

  cockroachdb.cluster.locks.count:
    enabled: true
    description: Number of locks grouped by database, table, strength, and grant status.
    unit: "{locks}"
    gauge:
      value_type: int
    attributes: [database, table, lock_strength, granted]

  cockroachdb.index.contention.events:
    enabled: true
    description: Number of contention events on an index.
    unit: "{events}"
    gauge:
      value_type: int
    attributes: [database, schema, table, index]

  cockroachdb.table.contention.events:
    enabled: true
    description: Number of contention events on a table.
    unit: "{events}"
    gauge:
      value_type: int
    attributes: [database, schema, table]

  cockroachdb.contention.events.total:
    enabled: true
    description: Total contention events across all tables and indexes.
    unit: "{events}"
    gauge:
      value_type: int

  cockroachdb.ranges.total:
    enabled: false
    description: Total number of ranges in the cluster. Not available on CockroachDB Serverless.
    unit: "{ranges}"
    gauge:
      value_type: int

  cockroachdb.ranges.under_replicated:
    enabled: false
    description: Number of under-replicated ranges. Not available on CockroachDB Serverless.
    unit: "{ranges}"
    gauge:
      value_type: int

  cockroachdb.ranges.unavailable:
    enabled: false
    description: Number of unavailable ranges. Not available on CockroachDB Serverless.
    unit: "{ranges}"
    gauge:
      value_type: int

  cockroachdb.nodes.live:
    enabled: false
    description: Number of live nodes. Not available on CockroachDB Serverless.
    unit: "{nodes}"
    gauge:
      value_type: int

  cockroachdb.nodes.total:
    enabled: false
    description: Total number of nodes in the cluster. Not available on CockroachDB Serverless.
    unit: "{nodes}"
    gauge:
      value_type: int

  cockroachdb.jobs.count:
    enabled: true
    description: Number of jobs by type and status.
    unit: "{jobs}"
    gauge:
      value_type: int
    attributes: [job_type, status]

  cockroachdb.schema_changes.active:
    enabled: true
    description: Number of active schema changes.
    unit: "{changes}"
    gauge:
      value_type: int
    attributes: [table, change_type, state]

tests:
  config:
    connection_string: "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
  skip_lifecycle: true
