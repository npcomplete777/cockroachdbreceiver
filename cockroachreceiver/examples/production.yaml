# Production Configuration Example
# Use this configuration for production CockroachDB monitoring

receivers:
  cockroachdb:
    # Required: PostgreSQL connection string to your CockroachDB cluster
    connection_string: "postgresql://monitoring_user:password@your-cluster.cockroachlabs.cloud:26257/defaultdb?sslmode=require"
    
    # Collection interval (default: 60s)
    collection_interval: "60s"
    
    # Connection pool settings
    max_open_connections: 10
    max_idle_connections: 5
    connection_max_lifetime: "1h"
    connection_max_idle_time: "10m"
    query_timeout: "30s"
    
    # Selective metric collection
    # PRODUCTION RECOMMENDATION: Enable only production-safe metrics
    metrics:
      # ✅ PRODUCTION SAFE - Core Performance Metrics (Always Enable)
      statement_statistics: true       # Query performance patterns
      transaction_statistics: true     # Transaction metrics
      index_usage_statistics: true     # Index usage for optimization
      cluster_queries: true             # Active queries
      cluster_sessions: true            # Session tracking
      cluster_transactions: true        # Active transactions
      
      # ✅ PRODUCTION SAFE - Contention Metrics (Moderate Overhead)
      cluster_locks: false              # Enable only when debugging deadlocks
      cluster_contended_indexes: true   # Contended index summary
      cluster_contended_keys: false     # Enable for deep contention debugging
      cluster_contended_tables: true    # Contended table summary
      cluster_contention_events: true   # Historical contention
      transaction_contention_events: false  # Detailed events (troubleshooting only)
      
      # ⚠️  NOT PRODUCTION SAFE - Expensive Operations (Keep Disabled)
      ranges_no_leases: false          # Triggers cluster-wide RPC fan-out
      gossip_liveness: false           # Unstable schema
      jobs: false                      # Expensive queries
      schema_changes: false            # Expensive queries
      node_metrics: false              # Triggers cluster-wide RPC fan-out
      kv_node_status: false            # Triggers cluster-wide RPC fan-out

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlphttp:
    endpoint: "https://your-metrics-backend.com"
    headers:
      Authorization: "Bearer YOUR_API_KEY"
    compression: gzip

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed

  pipelines:
    metrics:
      receivers: [cockroachdb]
      processors: [batch]
      exporters: [otlphttp]
